services:
  db:
    image: postgres:16
    container_name: bellissimo-hot-update-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotupdater
      POSTGRES_PASSWORD: hotupdater
      POSTGRES_DB: hotupdater
    volumes:
      - hot_update_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotupdater"]
      interval: 5s
      timeout: 5s
      retries: 10

  hot-update:
    build: .
    container_name: bellissimo-hot-update
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOT_UPDATER_AUTH_TOKEN: ${HOT_UPDATER_AUTH_TOKEN:?set HOT_UPDATER_AUTH_TOKEN}
      DATABASE_URL: postgres://hotupdater:hotupdater@db:5432/hotupdater
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME}

volumes:
  hot_update_pgdata:
