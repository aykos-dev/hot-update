services:
  db:
    image: postgres:16
    container_name: bellissimo-hot-update-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotupdater
      POSTGRES_PASSWORD: hotupdater
      POSTGRES_DB: hotupdater
    volumes:
      - hot_update_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotupdater"]
      interval: 5s
      timeout: 5s
      retries: 10

  hot-update:
    build: .
    container_name: bellissimo-hot-update
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      HOT_UPDATER_AUTH_TOKEN: ${HOT_UPDATER_AUTH_TOKEN:?set HOT_UPDATER_AUTH_TOKEN}
      DATABASE_URL: postgres://hotupdater:hotupdater@db:5432/hotupdater
      DATA_DIR: /data
    volumes:
      # Uploaded bundles + assets (served at /files). Back this up.
      - hot_update_data:/data

volumes:
  hot_update_pgdata:
  hot_update_data:
